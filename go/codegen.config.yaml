# Configuration for Go codegen from schemas/
# Tool: quicktype (https://github.com/quicktype/quicktype)
# Run: bash codegen.sh
output_package: types
output_dir: generated
sources:
  - name: UserPrompt
    schema: ../schemas/user-prompt.json
  - name: FinalResponse
    schema: ../schemas/final-response.json
  - name: ToolResult
    schema: ../schemas/tool-result.json
  - name: BundleManifest
    schema: ../schemas/bundle-manifest.json
